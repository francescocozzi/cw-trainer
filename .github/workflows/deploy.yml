# Controlla il codice a ogni push e lo copia sul server con rsync su SSH:
# il ramo main va in produzione, ogni altro ramo nella copia di staging.
# Segreti da impostare in Settings › Secrets and variables › Actions:
#   SSH_HOST         nome del server (es. ssh.tuohosting.it)
#   SSH_PORT         porta SSH (facoltativo, default 22)
#   SSH_USER         utente SSH
#   SSH_KEY          chiave privata dedicata al deploy (senza passphrase)
#   SSH_KNOWN_HOSTS  riga di `ssh-keyscan -p PORTA HOST`, per riconoscere il server
#   DEPLOY_PATH      cartella dell'app sul server (es. /home/utente/public_html/cw/)
#   DEPLOY_PATH_STAGING  cartella della copia di staging (database e utenti propri)
name: Controlli e deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova: mostra cosa cambierebbe sul server senza copiare nulla"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sintassi PHP
        run: for f in *.php; do php -l "$f"; done
      - name: Sintassi JavaScript
        run: for f in *.js; do node --check "$f"; done
      - name: Manifest JSON valido
        run: node -e 'JSON.parse(require("fs").readFileSync("manifest.webmanifest", "utf8"))'

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    # Un deploy alla volta per ambiente; uno nuovo aspetta che finisca quello in corso
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Chiave SSH
        id: ssh
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::notice::Segreti di deploy non impostati: deploy saltato."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copia sul server
        if: steps.ssh.outputs.skip != '1'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ github.ref == 'refs/heads/main' && secrets.DEPLOY_PATH || secrets.DEPLOY_PATH_STAGING }}
          STAGING: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
          DRY_RUN: ${{ inputs.prova && '--dry-run' || '' }}
        # config.php e i dati restano quelli del server; i file tolti dal repository
        # non vengono cancellati in produzione (niente --delete)
        run: |
          if [ -z "$DEPLOY_PATH" ]; then echo "::error::Cartella di destinazione non impostata"; exit 1; fi
          SSH_CMD="ssh -i ~/.ssh/deploy -p ${SSH_PORT:-22} -o StrictHostKeyChecking=yes"
          if [ -n "$STAGING" ]; then
            # Lo staging non deve finire nei motori di ricerca
            printf '\n<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> .htaccess
            # Il config.php del repository si copia solo la prima volta; poi resta quello del server
            rsync -ptz --itemize-changes $DRY_RUN --ignore-existing --chmod=F644 -e "$SSH_CMD" \
              --rsync-path="mkdir -p '${DEPLOY_PATH%/}' && rsync" \
              config.php "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/"
          fi
          rsync -rlptz --itemize-changes $DRY_RUN --chmod=D755,F644 \
            -e "$SSH_CMD" \
            --include='data/' --include='data/.htaccess' --exclude='data/**' \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
            --exclude='config.php' --exclude='README.md' \
            ./ "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/"
